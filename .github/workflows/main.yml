name: .NET MAUI Build Android

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout do código
      uses: actions/checkout@v4

    - name: Configurar Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'microsoft'
        java-version: '17'

    - name: Configurar .NET 10
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    # Este passo resolve o erro NETSDK1147 que apareceu antes
    - name: Instalar Workloads (Android e iOS)
      run: dotnet workload install maui-android maui-ios

    - name: Restaurar dependências
      run: dotnet restore

    - name: Build do Projeto
      run: dotnet build -c Release -f net10.0-android --no-restore
