name: Almoxarifado CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
    paths-ignore:
      - '**.md'
      - 'docs/**'

env:
  DOTNET_VERSION: '9.0.x'

jobs:
  backend-ci:
    name: Backend Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
    - name: Checkout do código
      uses: actions/checkout@v4

    - name: Configurar .NET SDK ${{ env.DOTNET_VERSION }}
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Cache de pacotes NuGet
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
        restore-keys: |
          ${{ runner.os }}-nuget-

    - name: Restaurar dependências da API e Testes
      run: |
        dotnet restore Almoxarifado.API/Almoxarifado.API.csproj
        dotnet restore TesteApp/TesteApp.csproj

    - name: Compilar a Solução (Backend)
      run: |
        dotnet build Almoxarifado.API/Almoxarifado.API.csproj -c Release --no-restore
        dotnet build TesteApp/TesteApp.csproj -c Release --no-restore

    - name: Executar Testes com Cobertura
      run: dotnet test TesteApp/TesteApp.csproj -c Release --no-build --verbosity normal --collect:"XPlat Code Coverage"

    - name: Publicar API
      run: dotnet publish Almoxarifado.API/Almoxarifado.API.csproj -c Release -o publish --no-restore

    - name: Upload Artifact da API
      uses: actions/upload-artifact@v4
      with:
        name: api-publish-${{ github.run_number }}
        path: publish

  mobile-android:
    name: Mobile Build (Android)
    runs-on: windows-latest
    needs: backend-ci
    timeout-minutes: 30
    
    steps:
    - name: Checkout do código
      uses: actions/checkout@v4

    - name: Configurar Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'microsoft'
        java-version: '17'

    - name: Configurar .NET SDK ${{ env.DOTNET_VERSION }}
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Cache de pacotes NuGet
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-mobile-${{ hashFiles('**/*.csproj') }}
        restore-keys: |
          ${{ runner.os }}-nuget-mobile-

    - name: Instalar Workload MAUI
      run: dotnet workload restore Almoxarifado.App/Almoxarifado.App.csproj

    - name: Restaurar dependências do Mobile
      run: dotnet restore Almoxarifado.App/Almoxarifado.App.csproj

    - name: Compilar o Projeto Mobile
      run: dotnet build Almoxarifado.App/Almoxarifado.App.csproj -c Release -f net9.0-android --no-restore

    - name: Publicar APK Android
      run: dotnet publish Almoxarifado.App/Almoxarifado.App.csproj -c Release -f net9.0-android --no-restore -p:AndroidSigningKeyStore=false

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: android-apk-${{ github.run_number }}
        path: '**/*.apk'
